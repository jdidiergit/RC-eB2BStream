<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Royal Canin — eB2B Portal · Change Requests Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --rc-red: #E2001A;
    --rc-red-dark: #B30014;
    --rc-red-soft: #FDECEE;
    --rc-ink: #1A1A1A;
    --rc-ink-soft: #4A4A4A;
    --rc-muted: #7A7A7A;
    --rc-bg: #FAFAFA;
    --rc-panel: #FFFFFF;
    --rc-border: #ECECEC;
    --rc-border-strong: #D9D9D9;
    --rc-amber: #F5A623;
    --rc-green: #2E8B57;
    --rc-blue: #2E5FBE;
    --rc-grey: #8A8A8A;
    --shadow-sm: 0 1px 2px rgba(20, 20, 20, 0.04);
    --shadow-md: 0 4px 16px rgba(20, 20, 20, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--rc-bg);
    color: var(--rc-ink);
    font-size: 14px;
    line-height: 1.5;
  }
  header.topbar {
    background: #FFFFFF;
    border-bottom: 3px solid var(--rc-red);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: var(--shadow-sm);
  }
  header.topbar img.logo {
    height: 44px;
    width: auto;
    display: block;
  }
  header.topbar .title-block h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--rc-ink);
  }
  header.topbar .title-block p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--rc-muted);
  }
  header.topbar .spacer { flex: 1; }
  header.topbar .stamp {
    font-size: 12px;
    color: var(--rc-muted);
    text-align: right;
  }
  header.topbar .stamp strong { color: var(--rc-red); font-weight: 700; }

  nav.tabs {
    background: #FFFFFF;
    border-bottom: 1px solid var(--rc-border);
    padding: 0 28px;
    display: flex;
    gap: 0;
    overflow-x: auto;
    position: sticky; top: 0; z-index: 50;
  }
  nav.tabs button {
    background: transparent;
    border: 0;
    padding: 14px 18px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--rc-ink-soft);
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: color .15s, border-color .15s, background .15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  nav.tabs button:hover { color: var(--rc-red); background: #FFF7F8; }
  nav.tabs button.active {
    color: var(--rc-red);
    border-bottom-color: var(--rc-red);
  }
  nav.tabs button .count-pill {
    display: inline-block;
    background: var(--rc-red-soft);
    color: var(--rc-red-dark);
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  nav.tabs button.active .count-pill {
    background: var(--rc-red);
    color: #FFFFFF;
  }

  main { padding: 28px; max-width: 1400px; margin: 0 auto; }
  .panel {
    background: var(--rc-panel);
    border: 1px solid var(--rc-border);
    border-radius: 12px;
    padding: 20px 22px;
    box-shadow: var(--shadow-sm);
  }

  /* KPI cards */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .kpi-card {
    background: var(--rc-panel);
    border: 1px solid var(--rc-border);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: "";
    position: absolute; inset: 0 auto 0 0; width: 4px;
    background: var(--rc-red);
  }
  .kpi-card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--rc-muted);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .kpi-card .value {
    font-size: 32px;
    font-weight: 800;
    color: var(--rc-ink);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .kpi-card .sub {
    font-size: 12px;
    color: var(--rc-muted);
    margin-top: 4px;
  }
  .kpi-card.accent .value { color: var(--rc-red); }

  /* Charts row */
  .chart-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .chart-card h3 {
    margin: 0 0 4px;
    font-size: 14px;
    font-weight: 700;
    color: var(--rc-ink);
  }
  .chart-card p.caption {
    margin: 0 0 14px;
    font-size: 12px;
    color: var(--rc-muted);
  }
  .chart-wrap { position: relative; height: 280px; }

  .split-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  /* Distribution bars (for % analysis status + % complexity) */
  .dist-list { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .dist-row .dist-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4px;
  }
  .dist-row .dist-head .name { font-weight: 600; font-size: 13px; color: var(--rc-ink); }
  .dist-row .dist-head .pct {
    font-weight: 700; font-size: 13px; color: var(--rc-ink);
    font-variant-numeric: tabular-nums;
  }
  .dist-row .dist-head .pct .abs {
    color: var(--rc-muted); font-weight: 500; margin-left: 6px; font-size: 12px;
  }
  .dist-bar {
    width: 100%; height: 10px;
    background: #F2F2F2; border-radius: 999px; overflow: hidden;
  }
  .dist-bar > span {
    display: block; height: 100%;
    border-radius: 999px;
    transition: width .4s ease;
  }

  /* Epic tab */
  .epic-header {
    display: flex; align-items: baseline; gap: 14px;
    margin-bottom: 16px;
  }
  .epic-header h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    color: var(--rc-ink);
    letter-spacing: -0.01em;
  }
  .epic-header .count {
    font-size: 13px;
    background: var(--rc-red);
    color: #FFFFFF;
    padding: 2px 10px;
    border-radius: 999px;
    font-weight: 700;
  }
  .epic-stats {
    display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; color: var(--rc-muted);
  }
  .epic-stats .pill {
    background: #F5F5F5; padding: 3px 10px; border-radius: 999px;
    color: var(--rc-ink-soft);
  }

  .feature-list { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .feature-card {
    background: var(--rc-panel);
    border: 1px solid var(--rc-border);
    border-left: 4px solid var(--rc-red);
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
  }
  .feature-card .fc-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 8px;
  }
  .feature-card .fc-title {
    font-weight: 700;
    font-size: 15px;
    color: var(--rc-ink);
    line-height: 1.35;
    flex: 1;
  }
  .feature-card .fc-id {
    font-size: 11px;
    font-weight: 700;
    color: var(--rc-red);
    background: var(--rc-red-soft);
    padding: 2px 8px;
    border-radius: 6px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .feature-card .fc-subdesc {
    font-size: 13px;
    color: var(--rc-ink-soft);
    white-space: pre-wrap;
    margin: 4px 0 10px;
  }
  .feature-card .fc-badges {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin: 8px 0 10px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid transparent;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .badge.status-new { background: #F0F4FF; color: #2E5FBE; border-color: #D9E3FB; }
  .badge.status-new .dot { background: #2E5FBE; }
  .badge.status-inprogress { background: #FFF7E6; color: #A66700; border-color: #FFE3A3; }
  .badge.status-inprogress .dot { background: #F5A623; }
  .badge.status-accepted { background: #E8F6EE; color: #1F6B41; border-color: #CFEADA; }
  .badge.status-accepted .dot { background: #2E8B57; }
  .badge.status-onhold { background: #F2F2F2; color: #555555; border-color: #E2E2E2; }
  .badge.status-onhold .dot { background: #8A8A8A; }
  .badge.status-other { background: #F2F2F2; color: #555; border-color: #E2E2E2; }
  .badge.status-other .dot { background: #8A8A8A; }

  .badge.cx-low { background: #E8F6EE; color: #1F6B41; border-color: #CFEADA; }
  .badge.cx-low .dot { background: #2E8B57; }
  .badge.cx-med { background: #FFF7E6; color: #A66700; border-color: #FFE3A3; }
  .badge.cx-med .dot { background: #F5A623; }
  .badge.cx-high { background: var(--rc-red-soft); color: var(--rc-red-dark); border-color: #F8D4D9; }
  .badge.cx-high .dot { background: var(--rc-red); }
  .badge.cx-none { background: #F2F2F2; color: #777; border-color: #E2E2E2; }
  .badge.cx-none .dot { background: #BBBBBB; }

  .badge.meta { background: #FAFAFA; color: var(--rc-ink-soft); border-color: var(--rc-border); }
  .badge.meta .dot { background: var(--rc-ink-soft); }

  .feature-card .fc-notes {
    margin-top: 10px;
    padding: 10px 12px;
    background: #FAFAFA;
    border: 1px solid var(--rc-border);
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--rc-ink-soft);
    white-space: pre-wrap;
    line-height: 1.55;
  }
  .feature-card .fc-notes .notes-label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--rc-muted);
    margin-bottom: 4px;
  }
  .feature-card .fc-notes.empty {
    color: var(--rc-muted); font-style: italic; background: #FFFFFF;
  }

  .section-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--rc-muted); margin: 0 0 10px;
  }

  /* SVG charts */
  svg.rc-chart { width: 100%; height: 100%; display: block; }
  svg.rc-chart text { font-family: inherit; }
  .donut-legend {
    display: flex; flex-direction: column; gap: 8px;
    font-size: 12px; color: var(--rc-ink);
  }
  .donut-legend .ll {
    display: flex; align-items: center; gap: 8px;
  }
  .donut-legend .sw {
    width: 10px; height: 10px; border-radius: 3px; display: inline-block;
  }
  .donut-legend .nm { flex: 1; }
  .donut-legend .vl {
    font-variant-numeric: tabular-nums;
    color: var(--rc-ink-soft); font-weight: 600;
  }
  .donut-wrap {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: center;
    height: 100%;
  }
  .donut-wrap .d-svg { position: relative; height: 100%; min-height: 220px; }
  .donut-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .donut-center .n { font-size: 26px; font-weight: 800; color: var(--rc-ink); line-height: 1; }
  .donut-center .l { font-size: 11px; color: var(--rc-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }

  /* Hide non-active tabs */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  @media (max-width: 1080px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .chart-grid { grid-template-columns: 1fr; }
    .split-row { grid-template-columns: 1fr; }
  }
</style>
</head>

aiting customer response\" first + ordered by date. Alfredo asked to have the same logic on billing documents", "release": "R6", "prioritization": "P3 - Deferred", "nextAction": "", "creationDate": "2026-11-03"}, {"crId": "CR-23", "title": "Free Of Charge Orders Display on the Order Detailed Page", "subdesc": "Rework Order Detailed Page for FOC Orders. For S/4-generated free-of-charge orders, pricing information (such as unit net price and subtotals) should be hidden/blanked out for eB2B users, keeping only the product names visible\n\nIf selected, then no need for CR-39", "epic": "Customer Service & Post-Purchase", "status": "New", "complexity": "Medium - M", "notes": "JD 09.11.2026 - Email sent to RC to confirm requirement relevancy - should we display FOC orders on the Portal?\nKnowing that returns are not allowed for FOC and those orders are really punctual hence not great candidates for reorder.\nJD 03.11.2026 - Added following email received from Mary \"eB2B - CR related to Free of charge orders\" on Nov 3rd during SIT. TBC if relevant.", "release": "R6", "prioritization": "P2 - Tentative", "nextAction": "", "creationDate": "2026-11-03"}, {"crId": "CR-24", "title": "Revise Order Detailed Page to include AI Generated order origin", "subdesc": "Include \"AI-Generated\" origin label following addition of a new Origin value \"AI\" by OM stream.", "epic": "Customer Service & Post-Purchase", "status": "Accepted", "complexity": "\u2014", "notes": "JD 04.11.2026 - Added following addition of a new Origin value \"AI\" by OM stream.", "release": "R5", "prioritization": "", "nextAction": "", "creationDate": "2026-11-04"}, {"crId": "CR-25", "title": "Revise Order Detailed Page to Clarify Delivery vs Shipping Date", "subdesc": "The eB2B Portal Order Detail page currently displays both \"Delivery Date\" and \"Shipping Date\" without clarifying context, creating potential confusion for Customers. While they may sound similar, they represent distinct milestones: the Delivery Date indicates the customer\u2019s requested arrival date selected at checkout, whereas the Shipping Date reflects the actual fulfillment date received via backend order updates from SAP S/4 to Salesforce (to be confirmed \ud83d\udea7).\nProposed Solution: To resolve this ambiguity, we propose adding dedicated, customer-facing explanatory tooltips directly next to both date fields. These tooltips will clearly define the scope of each milestone, explicitly distinguishing the buyer's requested delivery timeline from the actual warehouse shipment dispatch confirmation.\nExpected Outcome: Introducing these contextual definitions will ensure buyers immediately understand the difference between their requested delivery target and operational fulfillment progress. This enhancement will streamline order tracking visibility on the portal and prevent unnecessary customer support inquiries regarding order scheduling.", "epic": "Customer Service & Post-Purchase", "status": "Accepted", "complexity": "Low - XS", "notes": "JD 06.11.2026 - Added following discussion with Theo during SIT.", "release": "R5", "prioritization": "P1 - Must have", "nextAction": "", "creationDate": "2026-11-04"}, {"crId": "CR-26", "title": "Revise Return order detailed page to clarify Quantities", "subdesc": "On the eB2B Portal Return Order Detail page, the \"Returned Quantity\" field currently defaults to zero until items are physically scanned into the warehouse (confirmed quantity). While operationally accurate, this creates confusion for customers who have already initiated a return and cannot see any visual confirmation of the amount they originally requested to send back.\nProposed Solution: To resolve this lack of visibility, we suggest adding a dedicated \"Quantity Requested for Return\" field directly alongside the line items on the Return Order Detail view. Additionally, explanatory tooltips should be implemented across all three relevant fields\u2014Ordered Quantity, Quantity Requested for Return, and Returned Quantity\u2014to clearly differentiate between what was purchased, what was requested for return, and what has been physically received.\nExpected Outcome: Implementing these updates will eliminate ambiguity for users tracking ongoing returns by immediately validating their submitted request values while setting clear expectations around warehouse intake timelines. This will improve customer self-service clarity and reduce unnecessary inquiries regarding pending return quantities.", "epic": "Customer Service & Post-Purchase", "status": "Accepted", "complexity": "Low - XS", "notes": "JD 06.11.2026 - Added following discussion with Theo during SIT and upon official request sent via email \"eB2B - CR related to displaying Quantity Requested for Return\".", "release": "R6", "prioritization": "P1 - Must have", "nextAction": "", "creationDate": "2026-11-04"}, {"crId": "CR-27", "title": "History List Pages Click Behavior: Open record in a new tab on desktop", "subdesc": "Upon CTRL + Click from a desktop device opnly, open the following records in a newt tab:To be detailed\n- Visits from visit list/history Page in My Account\n- Cases from Cases list/history Page in My Account\n- Orders from Orders/Returns in My Account", "epic": "Customer Service & Post-Purchase", "status": "Accepted", "complexity": "Low - XS", "notes": "JD 05.11.2026 - Added following discussion with Theo during SIT.", "release": "R5", "prioritization": "", "nextAction": "", "creationDate": "2026-11-05"}, {"crId": "CR-28", "title": "History List Pages Browsing Behavior: For all History pages browsing behavior (Orders, Cases, Visits), ensure browser back-button persistence returns users to their exact previous page (e.g., page 2) rather than resetting to page 1.", "subdesc": "", "epic": "Customer Service & Post-Purchase", "status": "Accepted", "complexity": "Low - XS", "notes": "JD 04.11.2026 - Added following email received from Theo \"eB2B - CR related to all History List pages browsing b Added by Aude", "release": "R6", "prioritization": "P2 - Tentative", "nextAction": "", "creationDate": "2026-11-09"}, {"crId": "CR-36", "title": "Customer Payment Method Defaulting & Selection (Monday #3341965922 - as OM Dependency)", "subdesc": "Align the Storefront checkout experience with the new OM payment method defaulting rules, ensuring the appropriate default payment method is proposed and customers can select alternatives where permitted.", "epic": "Cart Checkout & Ordering", "status": "New", "complexity": "Medium - M", "notes": "JD 09.11.2026 - Added by Aude,  \"Payment terms\" multi-picklist mastered in SAP MDG brings additional options and complexity", "release": "R6", "prioritization": "P2 - Tentative", "nextAction": "", "creationDate": "2026-11-09"}, {"crId": "CR-37", "title": "Clinical Alliance: Ship-To Eligibility Error Handling & Messaging (SAP V1/117) (Monday #3341980028 - as OM Dependency)", "subdesc": "Enhance the Storefront handling and display of SAP V1/117 exclusion messages when the selected Ship-To is not enrolled in the Clinical Alliance program, while its associated Sold-To is entitled.\nProvide clear, contextual messaging to explain why Clinical Alliance products cannot be ordered for the selected Ship-To, and guide customers toward contacting their Sales Representative for further information or enrollment.", "epic": "Cart Checkout & Ordering", "status": "New", "complexity": "High - L", "notes": "JD 09.11.2026 - Added by Aude, scope relates to messaging only on the Cart unpon receiving Error from SAP", "release": "R6", "prioritization": "P1 - Must have", "nextAction": "", "creationDate": "2026-11-09"}, {"crId": "CR-38", "title": "Add searchable fields for Data Tables in My Account", "subdesc": "Rework Data Tables in My Account (Orders, Cases, Visits, Billing Docs) to include filtering and searchable fields + sorting cabapilities", "epic": "Customer Service & Post-Purchase", "status": "New", "complexity": "Medium - M", "notes": "JD 12.11.   };
  const EPIC_COLORS = [
    "#E2001A", "#B30014", "#2E5FBE", "#F5A623", "#2E8B57", "#8A52C9", "#2AA7A7", "#8A8A8A"
  ];

  function statusClass(s) {
    const map = {"New":"status-new","In progress":"status-inprogress","Accepted":"status-accepted","On Hold":"status-onhold"};
    return map[s] || "status-other";
  }
  function cxClass(c) {
    if (!c) return "cx-none";
    if (c.startsWith("Low")) return "cx-low";
    if (c.startsWith("Medium")) return "cx-med";
    if (c.startsWith("High")) return "cx-high";
    return "cx-none";
  }
  function cxLabel(c) { return c || "—"; }

  function countBy(items, key) {
    const m = new Map();
    for (const it of items) {
      const k = (it[key] == null || it[key] === "") ? "—" : it[key];
      m.set(k, (m.get(k) || 0) + 1);
    }
    return m;
  }

  function buildTabs() {
    const tabs = document.getElementById("tabs");
    const home = document.createElement("button");
    home.textContent = "Home";
    home.dataset.tab = "home";
    home.classList.add("active");
    tabs.appendChild(home);
    EPICS.forEach(epic => {
      const n = DATA.filter(d => d.epic === epic).length;
      const b = document.createElement("button");
      b.innerHTML = epic + ' <span class="count-pill">' + n + '</span>';
      b.dataset.tab = "epic:" + epic;
      tabs.appendChild(b);
    });
    tabs.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      [...tabs.children].forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      showTab(btn.dataset.tab);
    });
  }

  function showTab(id) {
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    const panel = document.getElementById("panel_" + cssSafe(id));
    if (panel) panel.classList.add("active");
    // For Home: (re)render charts after display so Chart.js can size
    if (id === "home") {
      renderCharts();
    }
    window.scrollTo({top: 0, behavior: "instant"});
  }

  function cssSafe(s) {
    return s.replace(/[^a-zA-Z0-9]/g, "_");
  }

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  }

  function buildHome() {
    const content = document.getElementById("content");
    const total = DATA.length;
    const byEpic = countBy(DATA, "epic");
    const byStatus = countBy(DATA, "status");
    const byComplexity = countBy(DATA, "complexity");
    const nEpics = byEpic.size;
    const biggestEpic = [...byEpic.entries()].sort((a,b) => b[1]-a[1])[0];
    const accepted = byStatus.get("Accepted") || 0;
    const acceptedPct = Math.round((accepted / total) * 100);

    const panel = document.createElement("section");
    panel.className = "tab-panel active";
    panel.id = "panel_home";

    // KPI cards
    panel.insertAdjacentHTML("beforeend", `
      <div class="kpi-grid">
        <div class="kpi-card accent">
          <div class="label">Total Change Requests</div>
          <div class="value">${total}</div>
          <div class="sub">pre-listed in the eB2B CR log</div>
        </div>
        <div class="kpi-card">
          <div class="label">Epics covered</div>
          <div class="value">${nEpics}</div>
          <div class="sub">Largest: ${esc(biggestEpic[0])} (${biggestEpic[1]})</div>
        </div>
        <div class="kpi-card">
          <div class="label">Analysis — Accepted</div>
          <div class="value">${acceptedPct}%</div>
          <div class="sub">${accepted} of ${total} CRs accepted</div>
        </div>
        <div class="kpi-card">
          <div class="label">New / pending analysis</div>
          <div class="value">${byStatus.get("New") || 0}</div>
          <div class="sub">awaiting first review</div>
        </div>
      </div>
    `);

    // Chart row: count per epic (SVG bar chart) + status donut (SVG)
    panel.insertAdjacentHTML("beforeend", `
      <div class="chart-grid">
        <div class="panel chart-card">
          <h3>Change Requests per Epic</h3>
          <p class="caption">Distribution of the ${total} CRs across product epics.</p>
          <div class="chart-wrap" id="chart_epics"></div>
        </div>
        <div class="panel chart-card">
          <h3>Analysis Status</h3>
          <p class="caption">Share of CRs in each analysis state.</p>
          <div class="chart-wrap" id="chart_status"></div>
        </div>
      </div>
    `);

    // Distribution rows: % Analysis Status + % Complexity
    function distHTML(title, subtitle, counts, colorMap) {
      const entries = [...counts.entries()].sort((a,b) => b[1]-a[1]);
      let rows = "";
      for (const [k, v] of entries) {
        const pct = (v / total) * 100;
        const color = colorMap[k] || "#8A8A8A";
        rows += `
          <div class="dist-row">
            <div class="dist-head">
              <span class="name">${esc(k)}</span>
              <span class="pct">${pct.toFixed(1)}% <span class="abs">(${v})</span></span>
            </div>
            <div class="dist-bar"><span style="width:${pct}%;background:${color};"></span></div>
          </div>
        `;
      }
      return `
        <div class="panel chart-card">
          <h3>${title}</h3>
          <p class="caption">${subtitle}</p>
          <div class="dist-list">${rows}</div>
        </div>
      `;
    }

    const splitWrap = document.createElement("div");
    splitWrap.className = "split-row";
    splitWrap.innerHTML =
      distHTML("% Analysis Status", "Percentage of CRs per analysis state.", byStatus, STATUS_COLORS) +
      distHTML("% Complexity", "Percentage of CRs by estimated complexity.", byComplexity, COMPLEXITY_COLORS);
    panel.appendChild(splitWrap);

    content.appendChild(panel);
  }

  function renderCharts() {
    const byEpic = countBy(DATA, "epic");
    const byStatus = countBy(DATA, "status");

    // --- Horizontal bar chart: CRs per Epic ---
    const epicEntries = [...byEpic.entries()].sort((a,b) => b[1]-a[1]);
    const maxVal = Math.max(...epicEntries.map(e => e[1]), 1);
    const tickMax = Math.ceil(maxVal / 2) * 2; // round up to even for nice ticks
    const barChartHost = document.getElementById("chart_epics");
    if (!barChartHost) return;

    const W = 620, H = 280;
    const padL = 190, padR = 32, padT = 12, padB = 28;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const n = epicEntries.length;
    const rowH = plotH / n;
    const barH = Math.min(26, rowH * 0.65);
    const xScale = v => (v / tickMax) * plotW;

    const ticks = [];
    const step = tickMax <= 6 ? 1 : 2;
    for (let t = 0; t <= tickMax; t += step) ticks.push(t);

    let svg = `<svg class="rc-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="CRs per epic">`;
    // gridlines + x-axis
    for (const t of ticks) {
      const x = padL + xScale(t);
      svg += `<line x1="${x}" x2="${x}" y1="${padT}" y2="${padT+plotH}" stroke="#F0F0F0" stroke-width="1"/>`;
      svg += `<text x="${x}" y="${padT+plotH+16}" font-size="11" fill="#7A7A7A" text-anchor="middle">${t}</text>`;
    }
    // bars
    epicEntries.forEach(([label, val], i) => {
      const color = EPIC_COLORS[i % EPIC_COLORS.length];
      const cy = padT + rowH * i + rowH / 2;
      const y = cy - barH / 2;
      const w = xScale(val);
      // epic label (truncate if too long)
      let lbl = label;
      if (lbl.length > 28) lbl = lbl.slice(0, 26) + "…";
      svg += `<text x="${padL - 10}" y="${cy + 4}" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="end">${esc(lbl)}</text>`;
      svg += `<rect x="${padL}" y="${y}" width="${Math.max(2, w)}" height="${barH}" rx="4" ry="4" fill="${color}"><title>${esc(label)}: ${val}</title></rect>`;
      // value label
      svg += `<text x="${padL + w + 6}" y="${cy + 4}" font-size="12" font-weight="700" fill="#1A1A1A">${val}</text>`;
    });
    // axis line
    svg += `<line x1="${padL}" x2="${padL}" y1="${padT}" y2="${padT+plotH}" stroke="#D9D9D9" stroke-width="1"/>`;
    svg += `</svg>`;
    barChartHost.innerHTML = svg;

    // --- Donut chart: Analysis Status ---
    const statusEntries = [...byStatus.entries()];
    const sTotal = statusEntries.reduce((a,b)=>a+b[1], 0);
    const statusHost = document.getElementById("chart_status");
    const cx = 110, cy = 110, rOuter = 92, rInner = 58;
    let acc = 0;
    let donut = `<div class="donut-wrap"><div class="d-svg"><svg class="rc-chart" viewBox="0 0 220 220" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Analysis status breakdown">`;
    // Background circle (in case of rounding gaps)
    donut += `<circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="#F5F5F5"/>`;
    donut += `<circle cx="${cx}" cy="${cy}" r="${rInner}" fill="#FFFFFF"/>`;

    function arcPath(startFrac, endFrac) {
      const toXY = (frac, r) => {
        const a = (frac * 2 * Math.PI) - Math.PI / 2; // start at top
        return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      };
      const [x1o, y1o] = toXY(startFrac, rOuter);
      const [x2o, y2o] = toXY(endFrac, rOuter);
      const [x1i, y1i] = toXY(endFrac, rInner);
      const [x2i, y2i] = toXY(startFrac, rInner);
      const large = (endFrac - startFrac) > 0.5 ? 1 : 0;
      return `M ${x1o} ${y1o} A ${rOuter} ${rOuter} 0 ${large} 1 ${x2o} ${y2o} L ${x1i} ${y1i} A ${rInner} ${rInner} 0 ${large} 0 ${x2i} ${y2i} Z`;
    }

    for (const [label, val] of statusEntries) {
      const frac = val / sTotal;
      const start = acc;
      const end = acc + frac;
      const color = STATUS_COLORS[label] || "#8A8A8A";
      // Avoid zero-length and full-circle edge cases
      if (frac > 0.999) {
        donut += `<circle cx="${cx}" cy="${cy}" r="${(rOuter+rInner)/2}" fill="none" stroke="${color}" stroke-width="${rOuter-rInner}"><title>${esc(label)}: ${val} (${(frac*100).toFixed(1)}%)</title></circle>`;
      } else if (frac > 0) {
        donut += `<path d="${arcPath(start, end)}" fill="${color}" stroke="#FFFFFF" stroke-width="1.5"><title>${esc(label)}: ${val} (${(frac*100).toFixed(1)}%)</title></path>`;
      }
      acc = end;
    }
    donut += `</svg>`;
    donut += `<div class="donut-center"><div class="n">${sTotal}</div><div class="l">CRs</div></div></div>`;
    // Legend
    donut += `<div class="donut-legend">`;
    for (const [label, val] of statusEntries) {
      const color = STATUS_COLORS[label] || "#8A8A8A";
      const pct = ((val / sTotal) * 100).toFixed(1);
      donut += `<div class="ll"><span class="sw" style="background:${color};"></span><span class="nm">${esc(label)}</span><span class="vl">${val} · ${pct}%</span></div>`;
    }
    donut += `</div></div>`;
    statusHost.innerHTML = donut;
  }

  function buildEpicPanel(epic) {
    const items = DATA.filter(d => d.epic === epic);
    const content = document.getElementById("content");
    const byStatus = countBy(items, "status");
    const byCx = countBy(items, "complexity");

    const panel = document.createElement("section");
    panel.className = "tab-panel";
    panel.id = "panel_" + cssSafe("epic:" + epic);

    const statsLine = [...byStatus.entries()].map(([k,v]) => `<span class="pill">${esc(k)}: <strong>${v}</strong></span>`).join("");
    const cxLine = [...byCx.entries()].map(([k,v]) => `<span class="pill">${esc(k)}: <strong>${v}</strong></span>`).join("");

    panel.insertAdjacentHTML("beforeend", `
      <div class="epic-header">
        <h2>${esc(epic)}</h2>
        <span class="count">${items.length} CR${items.length>1?"s":""}</span>
      </div>
      <div class="epic-stats">
        <span class="section-title" style="margin:0 4px 0 0;">Status</span>
        ${statsLine}
        <span class="section-title" style="margin:0 4px 0 16px;">Complexity</span>
        ${cxLine}
      </div>
    `);

    const list = document.createElement("div");
    list.className = "feature-list";

    for (const it of items) {
      const card = document.createElement("article");
      card.className = "feature-card";

      const metaBadges = [];
      if (it.release && it.release !== "-" && it.release !== "") {
        metaBadges.push(`<span class="badge meta"><span class="dot"></span>Release: ${esc(it.release)}</span>`);
      }
      if (it.prioritization && it.prioritization !== "-" && it.prioritization !== "") {
        metaBadges.push(`<span class="badge meta"><span class="dot"></span>${esc(it.prioritization)}</span>`);
      }
      if (it.creationDate) {
        metaBadges.push(`<span class="badge meta"><span class="dot"></span>Created: ${esc(it.creationDate)}</span>`);
      }

      const subdescHTML = it.subdesc ? `<div class="fc-subdesc">${esc(it.subdesc)}</div>` : "";
      const notesHTML = it.notes
        ? `<div class="fc-notes"><span class="notes-label">Notes</span>${esc(it.notes)}</div>`
        : `<div class="fc-notes empty"><span class="notes-label">Notes</span>No notes recorded.</div>`;

      card.innerHTML = `
        <div class="fc-top">
          <div class="fc-title">${esc(it.title)}</div>
          <span class="fc-id">${esc(it.crId)}</span>
        </div>
        ${subdescHTML}
        <div class="fc-badges">
          <span class="badge ${statusClass(it.status)}"><span class="dot"></span>${esc(it.status)}</span>
          <span class="badge ${cxClass(it.complexity)}"><span class="dot"></span>Complexity: ${esc(cxLabel(it.complexity))}</span>
          ${metaBadges.join("")}
        </div>
        ${notesHTML}
      `;
      list.appendChild(card);
    }
    panel.appendChild(list);
    content.appendChild(panel);
  }

  // Build everything
  buildTabs();
  buildHome();
  EPICS.forEach(buildEpicPanel);
  // Initial chart render (home is active by default)
  // requestAnimationFrame ensures canvas has layout size before Chart.js init
  requestAnimationFrame(() => renderCharts());
</script>
</body>
</html>
